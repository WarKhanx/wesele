<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan usadzenia gości</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>💍 Plan usadzenia gości</h1>
  <button class="btn primary" id="btnAddTable">+ Stół</button>
  <button class="btn" id="btnBulk">Wklej listę gości</button>
  <span class="sep"></span>
  <button class="btn" id="btnUndo" title="Cofnij (Ctrl+Z)">↶ Cofnij</button>
  <button class="btn" id="btnRedo" title="Ponów (Ctrl+Y)">↷ Ponów</button>
  <span class="sep"></span>
  <button class="btn" id="btnZoomOut" title="Oddal">−</button>
  <span class="zoom" id="zoomLabel"></span>
  <button class="btn" id="btnZoomIn" title="Przybliż">+</button>
  <button class="btn" id="btnFit">Dopasuj</button>
  <span class="spacer"></span>
  <button class="btn" id="btnSync" data-status="local">☁ Synchronizacja</button>
  <button class="btn" id="btnCsv">Eksport CSV</button>
  <button class="btn" id="btnPrint">Drukuj</button>
  <button class="btn" id="btnExport">Zapisz do pliku</button>
  <button class="btn" id="btnImport">Wczytaj z pliku</button>
  <button class="btn danger" id="btnNew">Nowy plan</button>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
</header>

<main>
  <aside id="sidebar">
    <div class="side-head">
      <div id="stats"></div>
      <input id="addGuest" type="text" placeholder="Dodaj gościa + Enter (para: Anna + Jan)">
      <input id="search" type="search" placeholder="Szukaj gościa…">
    </div>
    <div class="side-title">Nieposadzeni <span class="hint">(przeciągnij na miejsce)</span></div>
    <div id="unseated"></div>
    <div class="side-foot">Upuść gościa na tę listę, aby zdjąć go ze stołu. Para przesuwa się razem.</div>
  </aside>

  <section id="workspace">
    <div id="ctx"></div>
    <div id="stage"><div id="sizer"><div id="room"></div></div></div>
  </section>
</main>

<dialog id="bulkDlg">
  <form method="dialog">
    <h3>Wklej listę gości</h3>
    <p>Jedna osoba w wierszu. Parę zapisz ze znakiem <b>+</b>, np. <i>Anna Nowak + Jan Nowak</i>.</p>
    <textarea id="bulkText" rows="12" placeholder="Anna Nowak + Jan Nowak&#10;Ewa Lis&#10;Tomek Kowalczyk"></textarea>
    <div class="dlg-actions">
      <button class="btn" value="cancel">Anuluj</button>
      <button class="btn primary" id="bulkOk" value="ok">Dodaj</button>
    </div>
  </form>
</dialog>
<dialog id="syncDlg">
  <form method="dialog">
    <h3>☁ Synchronizacja między urządzeniami</h3>
    <p id="syncInfo"></p>
    <div id="syncBox">
      <label for="syncCode">Kod planu (tajny – kto go zna, może edytować plan)</label>
      <input id="syncCode" type="text" autocomplete="off" spellcheck="false" placeholder="min. 12 znaków: litery, cyfry, - lub _">
      <div class="dlg-actions left">
        <button class="btn" type="button" id="syncGen">Wygeneruj kod</button>
        <button class="btn primary" type="button" id="syncConnect">Połącz</button>
        <button class="btn danger" type="button" id="syncDisconnect">Rozłącz</button>
      </div>
    </div>
    <div class="dlg-actions"><button class="btn" value="cancel">Zamknij</button></div>
  </form>
</dialog>
<div id="toast"></div>

<script src="config.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
